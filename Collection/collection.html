<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的洛克王国纪念</title>
    <link rel="icon" type="image/png" href="../迪莫.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(145deg, #f0f6ff 0%, #faf0ff 100%);
            min-height: 100vh;
            padding: 40px 20px 60px;
            color: #2d3748;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 48px;
            padding: 20px 0 10px;
        }
        .header h1 {
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6c8cff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }
        .header p {
            font-size: 1.1rem;
            color: #7a8ba8;
            margin-top: 8px;
            font-weight: 400;
            letter-spacing: 4px;
        }
        .loading-tip {
            text-align: center;
            padding: 80px 20px;
            font-size: 1.2rem;
            color: #7a8ba8;
            letter-spacing: 2px;
        }
        .loading-tip .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 4px solid #e8eeff;
            border-top: 4px solid #6c8cff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 按钮文字不可选择 */
        .back-home-btn, .action-btn {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .back-home-btn {
            display: inline-block;
            margin-bottom: 32px;
            padding: 10px 32px;
            background: rgba(108, 140, 255, 0.12);
            border: 1px solid rgba(108, 140, 255, 0.2);
            border-radius: 30px;
            color: #5a7ac0;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.25s, transform 0.2s;
            letter-spacing: 1px;
            text-decoration: none;
            display: inline-block;
        }
        .back-home-btn:hover {
            background: rgba(108, 140, 255, 0.22);
            transform: translateY(-2px);
        }
        .back-home-btn .arrow {
            margin-right: 8px;
        }
        .bottom-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 40px;
        }
        .bottom-actions .action-btn {
            padding: 8px 28px;
            background: rgba(108, 140, 255, 0.12);
            border: 1px solid rgba(108, 140, 255, 0.25);
            border-radius: 30px;
            color: #5a7ac0;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            letter-spacing: 1px;
            display: inline-block;
            text-align: center;
            text-decoration: none;
        }
        .bottom-actions .action-btn:hover {
            background: rgba(108, 140, 255, 0.22);
            transform: translateY(-2px);
        }
        .section {
            margin-bottom: 48px;
        }
        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(108, 140, 255, 0.15);
        }
        .section-header h2 {
            font-size: 1.7rem;
            font-weight: 600;
            color: #2d3748;
            letter-spacing: 1px;
        }
        .pet-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 28px;
        }
        .pet-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 22px;
            padding: 24px 20px 20px;
            box-shadow: 0 4px 16px rgba(108, 140, 255, 0.08), 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pet-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(108, 140, 255, 0.15), 0 4px 12px rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.95);
        }
        .pet-card .img-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            overflow: hidden;
            background: #f5f9ff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 14px;
            border: 1px solid rgba(108, 140, 255, 0.06);
        }
        .pet-card .img-wrap a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }
        .pet-card .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.4s ease;
            padding: 14px;
            cursor: pointer;
        }
        .pet-card:hover .img-wrap img {
            transform: scale(1.05);
        }
        .pet-card .pet-name {
            font-size: 1.15rem;
            font-weight: 500;
            color: #2d3748;
            letter-spacing: 0.5px;
            line-height: 1.4;
            padding: 0 4px;
        }
        .img-wrap .placeholder {
            color: #d5e0f0;
            font-size: 0.9rem;
            font-weight: 300;
        }
        .footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid rgba(108, 140, 255, 0.10);
            color: #b8c8e0;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        .footer span {
            display: inline-block;
            margin: 0 6px;
        }
        .pet-card .img-wrap img {
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        .page-content {
            animation: pageFadeIn 0.4s ease;
        }
        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 1024px) {
            .pet-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; }
        }
        @media (max-width: 768px) {
            .pet-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
            .pet-card { padding: 18px 14px 16px; }
            .pet-card .pet-name { font-size: 1rem; }
            .back-home-btn { font-size: 0.85rem; padding: 8px 24px; }
            .bottom-actions .action-btn { font-size: 0.8rem; padding: 6px 20px; }
        }
        @media (max-width: 480px) {
            .pet-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
            .pet-card { padding: 14px 10px 12px; border-radius: 16px; }
            .pet-card .img-wrap img { padding: 8px; }
            .pet-card .pet-name { font-size: 0.9rem; }
            .header h1 { font-size: 2rem; }
            .section-header h2 { font-size: 1.3rem; }
            .bottom-actions { gap: 10px; margin-top: 30px; }
            .bottom-actions .action-btn { font-size: 0.75rem; padding: 6px 16px; }
        }
        @media (max-width: 360px) {
            .pet-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>收集区</h1>
            <!-- 副标题修改为 "特别的宠物" -->
            <p>✦ 特别的宠物 ✦</p>
        </header>

        <div id="pageContent" class="page-content">
            <a href="../index.html" class="back-home-btn">
                <span class="arrow">←</span> 返回首页
            </a>
            <div id="petGrid">
                <div class="loading-tip">
                    <div class="spinner"></div>
                    <div>数据加载中...</div>
                </div>
            </div>
            <div class="bottom-actions">
                <button class="action-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑ 返回页面顶部</button>
                <a href="../index.html" class="action-btn">← 返回首页</a>
            </div>
        </div>

        <footer class="footer">
            <span>✦</span> 珍藏每一份童真 <span>✦</span>
        </footer>
    </div>

    <script>
        fetch('collection-data.json')
            .then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            })
            .then(data => {
                let html = '';
                data.petData.forEach((section) => {
                    html += `
                        <section class="section">
                            <div class="section-header">
                                <h2>${section.series}</h2>
                            </div>
                            <div class="pet-grid">
                    `;
                    section.pets.forEach((pet) => {
                        const imgSrc = pet.img;
                        html += `
                            <div class="pet-card">
                                <div class="img-wrap">
                                    <a href="${imgSrc}" target="_blank" rel="noopener noreferrer">
                                        <img src="${imgSrc}" alt="${pet.name}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'placeholder\\'>✨ ${pet.name}</span>'" />
                                    </a>
                                </div>
                                <div class="pet-name">${pet.name}</div>
                            </div>
                        `;
                    });
                    html += `</div></section>`;
                });
                document.getElementById('petGrid').innerHTML = html;
            })
            .catch(err => {
                document.getElementById('petGrid').innerHTML = `
                    <div class="loading-tip" style="color:#e74c3c;">
                        <div style="font-size:2.4rem; margin-bottom:12px;">⚠️</div>
                        <div>数据加载失败，请确保 <strong>collection-data.json</strong> 文件存在且格式正确。</div>
                        <div style="font-size:0.85rem; margin-top:8px; color:#999;">${err.message}</div>
                    </div>
                `;
            });
    </script>
</body>
</html>
