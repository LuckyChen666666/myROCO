        /* ---------- 全局重置 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(145deg, #f0f6ff 0%, #faf0ff 100%);
            min-height: 100vh;
            padding: 40px 20px 60px;
            color: #2d3748;
        }

        /* ---------- 容器 ---------- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ---------- 头部 ---------- */
        .header {
            text-align: center;
            margin-bottom: 48px;
            padding: 20px 0 10px;
        }

        .header h1 {
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6c8cff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1.1rem;
            color: #7a8ba8;
            margin-top: 8px;
            font-weight: 400;
            letter-spacing: 4px;
        }

        /* ---------- 系列分隔 ---------- */
        .section {
            margin-bottom: 48px;
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(108, 140, 255, 0.15);
        }

        .section-header h2 {
            font-size: 1.7rem;
            font-weight: 600;
            color: #2d3748;
            letter-spacing: 1px;
        }

        /* ---------- 宠物网格：一行四列 ---------- */
        .pet-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 28px;
        }

        /* ---------- 宠物卡片 ---------- */
        .pet-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 22px;
            padding: 24px 20px 20px;
            box-shadow: 0 4px 16px rgba(108, 140, 255, 0.08), 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pet-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(108, 140, 255, 0.15), 0 4px 12px rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.95);
        }

        .pet-card .img-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            overflow: hidden;
            background: #f5f9ff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 14px;
            border: 1px solid rgba(108, 140, 255, 0.06);
        }

        .pet-card .img-wrap a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }

        .pet-card .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.4s ease;
            padding: 14px;
            cursor: pointer;
        }

        .pet-card:hover .img-wrap img {
            transform: scale(1.05);
        }

        .pet-card .pet-name {
            font-size: 1.15rem;
            font-weight: 500;
            color: #2d3748;
            letter-spacing: 0.5px;
            line-height: 1.4;
            padding: 0 4px;
        }

        /* ---------- 截图网格：一行两张 ---------- */
        .screenshot-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        /* ---------- 截图卡片 ---------- */
        .screenshot-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 22px;
            padding: 28px 24px 24px;
            box-shadow: 0 4px 16px rgba(108, 140, 255, 0.08), 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .screenshot-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(108, 140, 255, 0.15), 0 4px 12px rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.95);
        }

        .screenshot-card .img-wrap {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 18px;
            overflow: hidden;
            background: #f5f9ff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid rgba(108, 140, 255, 0.06);
        }

        .screenshot-card .img-wrap a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }

        .screenshot-card .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.4s ease;
            padding: 8px;
            cursor: pointer;
        }

        .screenshot-card:hover .img-wrap img {
            transform: scale(1.02);
        }

        .screenshot-card .screenshot-name {
            font-size: 1rem;
            font-weight: 500;
            color: #2d3748;
            margin-top: 14px;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        /* ---------- 空状态占位 ---------- */
        .img-wrap .placeholder {
            color: #d5e0f0;
            font-size: 0.9rem;
            font-weight: 300;
        }

        /* ---------- 页脚 ---------- */
        .footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid rgba(108, 140, 255, 0.10);
            color: #b8c8e0;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .footer span {
            display: inline-block;
            margin: 0 6px;
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 1024px) {
            .pet-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 24px;
            }
            .screenshot-grid {
                gap: 24px;
            }
        }

        @media (max-width: 768px) {
            .pet-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            .pet-card {
                padding: 18px 14px 16px;
            }
            .pet-card .pet-name {
                font-size: 1rem;
            }

            .screenshot-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .screenshot-card {
                padding: 20px 16px 18px;
            }
            .screenshot-card .screenshot-name {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            .pet-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
            .pet-card {
                padding: 14px 10px 12px;
                border-radius: 16px;
            }
            .pet-card .img-wrap img {
                padding: 8px;
            }
            .pet-card .pet-name {
                font-size: 0.9rem;
            }
            .header h1 {
                font-size: 2rem;
            }
            .section-header h2 {
                font-size: 1.3rem;
            }

            .screenshot-card {
                padding: 16px 12px 14px;
                border-radius: 16px;
            }
            .screenshot-card .img-wrap img {
                padding: 6px;
            }
            .screenshot-card .screenshot-name {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 360px) {
            .pet-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
        }

        /* ---------- 图片加载渐入 ---------- */
        .pet-card .img-wrap img,
        .screenshot-card .img-wrap img {
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

                const imgSrc = item.img;
                html += `
                    <div class="screenshot-card">
                        <div class="img-wrap">
                            <a href="${imgSrc}" target="_blank" rel="noopener noreferrer">
                                <img src="${imgSrc}" alt="${item.name}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'placeholder\\'>✨ ${item.name}</span>'" />
                            </a>
                        </div>
                        <div class="screenshot-name">${item.name}</div>
                    </div>
                `;
            });

            html += `
                    </div>
                </section>
            `;

            app.innerHTML = html;
        }

        render();
    </script>

</body>
</html>
