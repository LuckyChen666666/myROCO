        /* ---------- 全局重置 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(145deg, #f0f6ff 0%, #faf0ff 100%);
            min-height: 100vh;
            padding: 40px 20px 60px;
            color: #2d3748;
        }

        /* ---------- 容器 ---------- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ---------- 头部 ---------- */
        .header {
            text-align: center;
            margin-bottom: 48px;
            padding: 20px 0 10px;
        }

        .header h1 {
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6c8cff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1.1rem;
            color: #7a8ba8;
            margin-top: 8px;
            font-weight: 400;
            letter-spacing: 4px;
        }

        /* ---------- 不可选择 ---------- */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* ---------- 大区入口卡片 ---------- */
        .home-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            margin: 60px 0 40px;
        }

        .home-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 60px 40px 50px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(108, 140, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }

        .home-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 16px 60px rgba(108, 140, 255, 0.2);
        }

        .home-card .card-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            display: block;
        }

        .home-card .card-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .home-card.collect .card-icon {
            color: #6c8cff;
        }

        .home-card.memory .card-icon {
            color: #f5a623;
        }

        .home-card .card-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #2d3748;
            letter-spacing: 2px;
        }

        .home-card .card-badge {
            display: inline-block;
            margin-top: 16px;
            padding: 4px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .home-card.collect .card-badge {
            background: linear-gradient(135deg, #6c8cff, #a78bfa);
        }

        .home-card.memory .card-badge {
            background: linear-gradient(135deg, #f5a623, #f7c948);
        }

        /* ---------- 返回首页按钮（顶部） ---------- */
        .back-home-btn {
            display: inline-block;
            margin-bottom: 32px;
            padding: 10px 32px;
            background: rgba(108, 140, 255, 0.12);
            border: 1px solid rgba(108, 140, 255, 0.2);
            border-radius: 30px;
            color: #5a7ac0;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.25s, transform 0.2s;
            letter-spacing: 1px;
        }

        .back-home-btn:hover {
            background: rgba(108, 140, 255, 0.22);
            transform: translateY(-2px);
        }

        .back-home-btn .arrow {
            margin-right: 8px;
        }

        /* ---------- 底部操作按钮容器 ---------- */
        .bottom-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 40px;
        }

        .bottom-actions .action-btn {
            padding: 8px 28px;
            background: rgba(108, 140, 255, 0.12);
            border: 1px solid rgba(108, 140, 255, 0.25);
            border-radius: 30px;
            color: #5a7ac0;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            letter-spacing: 1px;
            display: inline-block;
            text-align: center;
        }

        .bottom-actions .action-btn:hover {
            background: rgba(108, 140, 255, 0.22);
            transform: translateY(-2px);
        }

        /* ---------- 系列分隔 ---------- */
        .section {
            margin-bottom: 48px;
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(108, 140, 255, 0.15);
        }

        .section-header h2 {
            font-size: 1.7rem;
            font-weight: 600;
            color: #2d3748;
            letter-spacing: 1px;
        }

        /* ---------- 折叠功能 ---------- */
        .foldable-section .section-header {
            cursor: pointer;
            user-select: none;
        }

        .foldable-section .section-header .toggle-icon {
            margin-left: 12px;
            font-size: 1.2rem;
            transition: transform 0.3s ease;
            display: inline-block;
        }

        .foldable-section .section-header .toggle-icon.open {
            transform: rotate(90deg);
        }

        .foldable-content.folded {
            display: none;
        }

        /* ---------- 宠物网格：一行四列 ---------- */
        .pet-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 28px;
        }

        /* ---------- 宠物卡片 ---------- */
        .pet-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 22px;
            padding: 24px 20px 20px;
            box-shadow: 0 4px 16px rgba(108, 140, 255, 0.08), 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pet-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(108, 140, 255, 0.15), 0 4px 12px rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.95);
        }

        .pet-card .img-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            overflow: hidden;
            background: #f5f9ff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 14px;
            border: 1px solid rgba(108, 140, 255, 0.06);
        }

        .pet-card .img-wrap a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }

        .pet-card .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.4s ease;
            padding: 14px;
            cursor: pointer;
        }

        .pet-card:hover .img-wrap img {
            transform: scale(1.05);
        }

        .pet-card .pet-name {
            font-size: 1.15rem;
            font-weight: 500;
            color: #2d3748;
            letter-spacing: 0.5px;
            line-height: 1.4;
            padding: 0 4px;
        }

        /* ---------- 截图网格：一行两张 ---------- */
        .screenshot-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        /* ---------- 截图卡片 ---------- */
        .screenshot-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 22px;
            padding: 28px 24px 24px;
            box-shadow: 0 4px 16px rgba(108, 140, 255, 0.08), 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .screenshot-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(108, 140, 255, 0.15), 0 4px 12px rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.95);
        }

        .screenshot-card .img-wrap {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 18px;
            overflow: hidden;
            background: #f5f9ff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid rgba(108, 140, 255, 0.06);
        }

        .screenshot-card .img-wrap a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }

        .screenshot-card .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.4s ease;
            padding: 8px;
            cursor: pointer;
        }

        .screenshot-card:hover .img-wrap img {
            transform: scale(1.02);
        }

        .screenshot-card .screenshot-name {
            font-size: 1rem;
            font-weight: 500;
            color: #2d3748;
            margin-top: 14px;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        /* ---------- 空状态占位 ---------- */
        .img-wrap .placeholder {
            color: #d5e0f0;
            font-size: 0.9rem;
            font-weight: 300;
        }

        /* ---------- 页脚 ---------- */
        .footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid rgba(108, 140, 255, 0.10);
            color: #b8c8e0;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .footer span {
            display: inline-block;
            margin: 0 6px;
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 1024px) {
            .pet-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 24px;
            }
            .screenshot-grid {
                gap: 24px;
            }
            .home-grid {
                gap: 30px;
            }
            .home-card .card-icon {
                width: 64px;
                height: 64px;
            }
        }

        @media (max-width: 768px) {
            .home-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .home-card {
                padding: 40px 30px 35px;
                min-height: 200px;
            }
            .home-card .card-icon {
                width: 56px;
                height: 56px;
            }
            .home-card .card-title {
                font-size: 1.8rem;
            }

            .pet-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            .pet-card {
                padding: 18px 14px 16px;
            }
            .pet-card .pet-name {
                font-size: 1rem;
            }

            .screenshot-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .screenshot-card {
                padding: 20px 16px 18px;
            }
            .screenshot-card .screenshot-name {
                font-size: 0.95rem;
            }

            .back-home-btn {
                font-size: 0.85rem;
                padding: 8px 24px;
            }

            .bottom-actions .action-btn {
                font-size: 0.8rem;
                padding: 6px 20px;
            }
        }

        @media (max-width: 480px) {
            .home-card {
                padding: 30px 20px 28px;
                min-height: 160px;
                border-radius: 24px;
            }
            .home-card .card-icon {
                width: 48px;
                height: 48px;
                margin-bottom: 12px;
            }
            .home-card .card-title {
                font-size: 1.4rem;
            }

            .pet-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
            .pet-card {
                padding: 14px 10px 12px;
                border-radius: 16px;
            }
            .pet-card .img-wrap img {
                padding: 8px;
            }
            .pet-card .pet-name {
                font-size: 0.9rem;
            }
            .header h1 {
                font-size: 2rem;
            }
            .section-header h2 {
                font-size: 1.3rem;
            }

            .screenshot-card {
                padding: 16px 12px 14px;
                border-radius: 16px;
            }
            .screenshot-card .img-wrap img {
                padding: 6px;
            }
            .screenshot-card .screenshot-name {
                font-size: 0.85rem;
            }

            .bottom-actions {
                gap: 10px;
                margin-top: 30px;
            }
            .bottom-actions .action-btn {
                font-size: 0.75rem;
                padding: 6px 16px;
            }
        }

        @media (max-width: 360px) {
            .pet-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
        }

        /* ---------- 图片加载渐入 ---------- */
        .pet-card .img-wrap img,
        .screenshot-card .img-wrap img {
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* ---------- 页面切换淡入 ---------- */
        .page-content {
            animation: pageFadeIn 0.4s ease;
        }

        @keyframes pageFadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

                            <div class="img-wrap">
                                <a href="${imgSrc}" target="_blank" rel="noopener noreferrer">
                                    <img src="${imgSrc}" alt="${pet.name}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'placeholder\\'>✨ ${pet.name}</span>'" />
                                </a>
                            </div>
                            <div class="pet-name">${pet.name}</div>
                        </div>
                    `;
                });
                html += `
                            </div>
                            <div class="bottom-actions no-select">
                                <button class="action-btn" onclick="scrollToSectionTop(this)">↑ 返回系列顶部</button>
                                <button class="action-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑ 返回页面顶部</button>
                                <button class="action-btn" onclick="navigateTo('home')">← 返回首页</button>
                            </div>
                        </div>
                    </section>
                `;
            });

            // 回忆区 - 截图部分
            html += `
                <section class="section foldable-section">
                    <div class="section-header">
                        <h2>其他纪念截图 <span class="toggle-icon">▶</span></h2>
                    </div>
                    <div class="foldable-content folded">
                        <div class="screenshot-grid">
            `;
            screenshotData.forEach((item) => {
                const imgSrc = item.img;
                html += `
                    <div class="screenshot-card">
                        <div class="img-wrap">
                            <a href="${imgSrc}" target="_blank" rel="noopener noreferrer">
                                <img src="${imgSrc}" alt="${item.name}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'placeholder\\'>✨ ${item.name}</span>'" />
                            </a>
                        </div>
                        <div class="screenshot-name">${item.name}</div>
                    </div>
                `;
            });
            html += `
                        </div>
                        <div class="bottom-actions no-select">
                            <button class="action-btn" onclick="scrollToSectionTop(this)">↑ 返回系列顶部</button>
                            <button class="action-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑ 返回页面顶部</button>
                            <button class="action-btn" onclick="navigateTo('home')">← 返回首页</button>
                        </div>
                    </div>
                </section>
            `;

            html += `</div>`;
            pageContent.innerHTML = html;

            // 绑定折叠事件
            document.querySelectorAll('.foldable-section .section-header').forEach(header => {
                header.addEventListener('click', function(e) {
                    const section = this.closest('.section');
                    const content = section.querySelector('.foldable-content');
                    if (content) {
                        content.classList.toggle('folded');
                        const icon = this.querySelector('.toggle-icon');
                        if (icon) {
                            icon.classList.toggle('open');
                        }
                    }
                });
            });
        }

        // ============================================================
        //  导航函数（暴露到全局）
        // ============================================================
        window.navigateTo = function(page) {
            if (page === currentPage) return;
            switch (page) {
                case 'home':
                    renderHome();
                    break;
                case 'collect':
                    renderCollect();
                    break;
                case 'memory':
                    renderMemory();
                    break;
                default:
                    renderHome();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // ============================================================
        //  初始化 - 渲染首页
        // ============================================================
        renderHome();
    </script>

</body>
</html>
