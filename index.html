<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的洛克王国纪念</title>
    <link rel="icon" type="image/png" href="迪莫.png">
    <style>
        /* ---------- 全局重置 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(145deg, #f0f6ff 0%, #faf0ff 100%);
            min-height: 100vh;
            padding: 40px 20px 60px;
            color: #2d3748;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ---------- 头部 ---------- */
        .header {
            text-align: center;
            margin-bottom: 48px;
            padding: 20px 0 10px;
        }

        .header h1 {
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6c8cff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1.1rem;
            color: #7a8ba8;
            margin-top: 8px;
            font-weight: 400;
            letter-spacing: 4px;
        }

        /* ---------- 不可选择 ---------- */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* ---------- 大区入口卡片 ---------- */
        .home-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            margin: 60px 0 40px;
        }

        .home-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 60px 40px 50px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(108, 140, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            text-decoration: none;
            color: inherit;
        }

        .home-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 16px 60px rgba(108, 140, 255, 0.2);
        }

        .home-card .card-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            display: block;
        }

        .home-card .card-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .home-card.collect .card-icon {
            color: #6c8cff;
        }

        .home-card.memory .card-icon {
            color: #f5a623;
        }

        .home-card .card-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #2d3748;
            letter-spacing: 2px;
        }

        .home-card .card-badge {
            display: inline-block;
            margin-top: 16px;
            padding: 4px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .home-card.collect .card-badge {
            background: linear-gradient(135deg, #6c8cff, #a78bfa);
        }

        .home-card.memory .card-badge {
            background: linear-gradient(135deg, #f5a623, #f7c948);
        }

        /* ---------- 页脚 ---------- */
        .footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid rgba(108, 140, 255, 0.10);
            color: #b8c8e0;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .footer span {
            display: inline-block;
            margin: 0 6px;
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 768px) {
            .home-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .home-card {
                padding: 40px 30px 35px;
                min-height: 200px;
            }
            .home-card .card-icon {
                width: 56px;
                height: 56px;
            }
            .home-card .card-title {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            .home-card {
                padding: 30px 20px 28px;
                min-height: 160px;
                border-radius: 24px;
            }
            .home-card .card-icon {
                width: 48px;
                height: 48px;
                margin-bottom: 12px;
            }
            .home-card .card-title {
                font-size: 1.4rem;
            }
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>我的洛克王国纪念</h1>
            <p>✦ 每一只宠物都是一段冒险回忆 ✦</p>
        </header>

        <!-- 首页入口卡片 -->
        <div class="home-grid no-select">
            <!-- 修改了链接路径，指向 Collection 子文件夹 -->
            <a href="Collection/collection.html" class="home-card collect">
                <span class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                    </svg>
                </span>
                <div class="card-title">收集区</div>
                <span class="card-badge">特别的宠物</span>
            </a>
            <!-- 修改了链接路径，指向 Memory 子文件夹 -->
            <a href="Memory/memory.html" class="home-card memory">
                <span class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"/>
                        <path d="M21 15l-5-5-5 5" stroke="currentColor"/>
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor"/>
                    </svg>
                </span>
                <div class="card-title">回忆区</div>
                <span class="card-badge">回忆老宠与纪念截图</span>
            </a>
        </div>

        <!-- 页脚 -->
        <footer class="footer">
            <span>✦</span> 珍藏每一份童真 <span>✦</span>
        </footer>
    </div>

</body>
</html>
